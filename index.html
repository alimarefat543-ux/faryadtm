let st=x.settings||{};st.seqGroup=Math.max(2,Number(st.seqGroup)||2);st.seqChannel=Math.max(5,Number(st.seqChannel)||5);x.settings=st;let m=x.users.find(u=>u.id==='u_manager'&&u.role==='manager');if(!m){m={id:'u_manager',role:'manager',first:'مدیر',last:'ارشد فریاد',username:'faryad',password:'13801380',phone:'',app:'',joined:today(),title:'مدیریت آکادمی'};x.users.unshift(m)}else{m.username='faryad';m.password='13801380';m.role='manager';m.first=m.first||'مدیر';m.last=m.last||'ارشد فریاد';m.title=m.title||'مدیریت آکادمی'};x.users.forEach(u=>{if(u.role==='student'&&!u.examCredentials)u.examCredentials={username:'',password:'',updatedAt:'',updatedBy:''}});x.messages=(x.messages||[]).map(m=>{if(!Array.isArray(m.readBy))m.readBy=[];return m});x.communities=(x.communities||[]).map(c=>{c.messages=(c.messages||[]).map(m=>{if(!Array.isArray(m.readBy))m.readBy=[];return m});return c});let planCounters={};x.plans=(x.plans||[]).map(p=>{let sid=p.studentId;planCounters[sid]=planCounters[sid]||0;if(Number(p.number)>0){planCounters[sid]=Math.max(planCounters[sid],Number(p.number))}else{p.number=Math.min(1000,planCounters[sid]+1);planCounters[sid]=p.number}p.readBy=Array.isArray(p.readBy)?p.readBy:[];return p});x.notifications=(x.notifications||[]).map(n=>{if(!Array.isArray(n.readBy))n.readBy=n.read? [n.userId] : [];if(!n.type)n.type=(String(n.text||'').includes('برنامه هفتگی')?'plan':'message');return n});save(x);return x}}catch(e){}return seed()}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function seed(){let x={users:[],reports:[],plans:[],messages:[],communities:[],joins:[],notifications:[],aiLogs:[],settings:{seqGroup:2,seqChannel:5}};x.users.push({id:'u_manager',role:'manager',first:'مدیر',last:'ارشد فریاد',username:'faryad',password:'13801380',phone:'',app:'',joined:today(),title:'مدیریت آکادمی'});save(x);return x}
function currentDB(){return db()}
function login(role){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;let d=currentDB();let user=d.users.find(x=>x.role===role&&x.username===u&&x.password===p);if(!user){toast('نام کاربری یا رمز عبور صحیح نیست','bad');return}state.user=user;state.section='dashboard';render()}
function openLogin(role){document.getElementById('modalBody').innerHTML=`<h2>ورود ${roleNames[role]} به پنل</h2><div class="formgrid"><div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login('${role}')"></div></div><div class="actions"><button class="btn" onclick="login('${role}')">ورود به پنل</button></div>`;document.getElementById('modal').classList.remove('hidden');document.getElementById('loginUser').focus()}
function logout(){state.user=null;state.section='dashboard';render()}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(msg,type='good'){let n=document.createElement('div');n.style='position:fixed;left:20px;bottom:20px;z-index:999;background:#fff;border:1px solid #dbe7f5;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:13px 18px;border-radius:14px;font-weight:800;color:'+(type==='bad'?'#b42318':'#14532d');n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}
function render(){document.getElementById('app').innerHTML=state.user?panel():landing()}
function landing(){return `<div class="hero"><div class="heroTop"><div class="heroPhoto officialLeaders" style="grid-column:1/3"><div class="leaderStrip"><div class="leader"><img alt="امام خمینی" src="https://commons.wikimedia.org/wiki/Special:FilePath/Ruhollah_Khomeini_1964_portrait.jpg"><span>امام خمینی (ره)</span></div><div class="leader"><img alt="امام خامنه‌ای" src="https://commons.wikimedia.org/wiki/Special:FilePath/Ali_Khamenei_2026.02.12.jpg"><span>امام خامنه‌ای</span></div><div class="leader"><img alt="سید مجتبی خامنه‌ای" src="https://commons.wikimedia.org/wiki/Special:FilePath/Mojtaba_Khamenei%2C_March_8%2C_2026_%28cropped_3-4%29.jpg"><span>سید مجتبی خامنه‌ای</span></div></div><div class="photoCaption">قاب رسمی رهبران جمهوری اسلامی ایران</div></div><div class="heroCenter" style="grid-column:3"><div class="flag">🇮🇷</div><h1>آکادمی کنکوری فریاد</h1><p>برنامه رشد موفقیت</p><div class="notice">به سامانه جامع آکادمی کنکوری فریاد خوش آمدید؛ مسیر رشد، برنامه‌ریزی، گزارش‌گیری و ارتباط در یک پنل یکپارچه.</div></div></div><div class="loginCards"><div class="loginCard"><h3>🎓 ورود دانش‌آموز</h3><p>گزارش شبانه، برنامه هفتگی، پیام‌رسان، فریاد AI و درصدگیری.</p><button class="btn" onclick="openLogin('student')">ورود دانش‌آموز</button></div><div class="loginCard"><h3>👨‍🏫 ورود مشاور</h3><p>بررسی گزارش‌ها، برنامه‌ریزی هفتگی، تحلیل و ارتباط با دانش‌آموزان.</p><button class="btn" onclick="openLogin('consultant')">ورود مشاور</button></div><div class="loginCard"><h3>👑 ورود مدیر ارشد</h3><p>مدیریت اعضا، آمار، پیام‌رسان، برنامه‌ها و تحلیل کل آکادمی.</p><button class="btn" onclick="openLogin('manager')">ورود مدیر ارشد</button></div></div>${Footer()}</div>`}
function Footer(){return `<footer class="footer">جمهوری اسلامی ایران<br>تمامی محتویات این اپلیکیشن / سایت برای آکادمی کنکوری فریاد محفوظ میباشد.<b>فریاد : صدای رتبه برتر ها</b></footer>`}
function nav(items){let d=currentDB(),u=state.user;return `<aside class="sidebar">${items.map(([id,t,ic])=>{let badge=id==='chat'?unreadChatCount():id==='announcements'?unreadAnnouncementCount():id==='plans'&&u.role==='consultant'?0:id==='plans'&&u.role==='student'?unreadPlanCount():0;let notice=id==='announcements'&&badge>0;return `<button class="navbtn ${state.section===id?'active':''} ${notice?'hasNotice':''}" onclick="state.section='${id}';${id==='announcements'?'markAllNotificationsRead();':''}render()">${ic} ${t}${badge?` <span class="unreadBadge">${badge}</span>`:''}</button>`}).join('')}<button class="navbtn" onclick="logout()">🚪 خروج</button></aside>`}
function panel(){let u=state.user;let items=u.role==='manager'?[['dashboard','داشبورد','📊'],['members','اعضا','👥'],['stats','آمار','📈'],['schedule','برنامه‌های دانش‌آموزان','🗓️'],['chat','فریاد چت','💬'],['ai','فریاد AI مدیر','🤖']]:u.role==='consultant'?[['dashboard','داشبورد','📊'],['reports','گزارشات','📋'],['plans','برنامه هفتگی','🗓️'],['announcements','اعلان‌ها','📢'],['exams','آزمون‌ها','🎯'],['chat','فریاد چت','💬']]:[['dashboard','داشبورد','🏠'],['report','گزارش شبانه','📝'],['plans','برنامه‌های هفتگی','🗓️'],['announcements','اعلان‌ها','📢'],['exams','آزمون‌ها','🎯'],['chat','فریاد چت','💬'],['ai','فریاد AI','🤖'],['percent','درصدگیری','🧮']];return `<div class="app"><header class="topbar"><div class="brand"><div class="brandMark">ف</div><div><h1>آکادمی کنکوری فریاد</h1><small>برنامه رشد موفقیت</small></div></div><div class="userbox"><span class="pill">${roleNames[u.role]}</span><span>${esc(u.first+' '+u.last)}</span>${u.title?`<span class="tag">${esc(u.title)}</span>`:''}</div></header><div class="layout">${nav(items)}<main>${content()}<Footer/></main></div></div>`}
function content(){switch(state.section){case'members':return managerMembers();case'stats':return managerStats();case'schedule':return managerSchedule();case'chat':return chatView();case'ai':return state.user.role==='manager'?managerAI():studentAI();case'reports':return consultantReports();case'plans':return state.user.role==='consultant'?consultantPlans():studentPlans();case'announcements':return state.user.role==='consultant'?consultantAnnouncements():announcementsView();case'exams':return state.user.role==='consultant'?consultantExams():examsView();case'report':return studentReport();case'percent':return percent();default:return dashboard()}}
function dashboard(){let d=currentDB(),u=state.user;if(u.role==='manager')return `<div class="pageTitle"><h2>داشبورد مدیر ارشد</h2></div><div class="grid g4">${statCard('دانش‌آموزان',d.users.filter(x=>x.role==='student').length)}${statCard('مشاوران',d.users.filter(x=>x.role==='consultant').length)}${statCard('گزارش‌ها',d.reports.length)}${statCard('پیام‌ها',d.messages.length)}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>وضعیت گزارش‌های اخیر</h3>${statusSummary(d)}</div><div class="card"><h3>اعضای اخیر</h3>${d.users.slice(-5).reverse().map(x=>`<div class="metricline"><span>${esc(x.first+' '+x.last)}</span><span class="tag">${roleNames[x.role]}</span></div>`).join('')}</div></div>`;if(u.role==='consultant')return consultantDashboard();return studentDashboard()}
function statCard(a,b){return `<div class="card stat"><small>${a}</small><div class="num">${b}</div></div>`}
function statusSummary(d){let c={pending:0,approved:0,rejected:0};d.reports.forEach(r=>c[r.status]=(c[r.status]||0)+1);return `<div class="metricline"><span>⏳ در انتظار</span><b>${c.pending}</b></div><div class="metricline"><span>✅ تأیید</span><b>${c.approved}</b></div><div class="metricline"><span>❌ رد</span><b>${c.rejected}</b></div>`}
function managerMembers(){let d=currentDB();return `<div class="pageTitle"><h2>مدیریت اعضا</h2><div class="actions"><button class="btn" onclick="memberForm('student')">+ ایجاد دانش‌آموز</button><button class="btn secondary" onclick="memberForm('consultant')">+ ایجاد مشاور</button></div></div><div class="grid g2"><div class="card"><h3>دانش‌آموزان</h3>${userTable(d.users.filter(x=>x.role==='student'))}</div><div class="card"><h3>مشاوران</h3>${userTable(d.users.filter(x=>x.role==='consultant'))}</div></div>`}
function userTable(arr){return `<div class="tablewrap"><table class="table"><thead><tr><th>نام</th><th>رشته/پایه</th><th>لقب</th><th>عملیات</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.first+' '+x.last)}</b><br><small>${esc(x.username)}</small></td><td>${esc(x.field||'—')} / ${esc(x.grade||'—')}</td><td>${esc(x.title||'—')}</td><td><button class="btn small" onclick="viewUser('${x.id}')">مشاهده</button> <button class="btn small secondary" onclick="editTitle('${x.id}')">لقب</button> <button class="btn small danger" onclick="removeUser('${x.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div>`}
function memberForm(role,id){let d=currentDB(),u=id?d.users.find(x=>x.id===id):{};document.getElementById('modalBody').innerHTML=`<h2>${id?'ویرایش':'ایجاد'} ${roleNames[role]}</h2><div class="formgrid">${role==='student'?studentFields(u):consultantFields(u)}</div><div class="actions"><button class="btn" onclick="saveMember('${role}','${id||''}')">ذخیره</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function studentFields(u){return field('first','نام',u.first)+field('last','نام خانوادگی',u.last)+field('grade','پایه',u.grade,'select',grades)+field('field','رشته',u.field,'select',fields)+field('initialConsult','نظر اولیه مشاور',u.initialConsult)+field('initialManager','نظر اولیه مدیر ارشد',u.initialManager)+field('joined','تاریخ عضویت',u.joined||today(),'input','',true)+field('familiarity','دلیل آشنایی با فریاد',u.familiarity)+field('exam','آیا در آزمون‌ها شرکت می‌کند؟',u.exam,'select',['بله','خیر'])+field('phone','شماره موبایل',u.phone)+field('app','اپلیکیشن ارتباطی',u.app)+field('username','نام کاربری',u.username)+field('password','رمز عبور',u.password)+field('consultantId','مشاور',u.consultantId,'select',currentDB().users.filter(x=>x.role==='consultant').map(x=>x.id),currentDB().users.filter(x=>x.role==='consultant').map(x=>x.first+' '+x.last))}
function consultantFields(u){return field('first','نام',u.first)+field('last','نام خانوادگی',u.last)+field('age','سن',u.age)+field('grade','پایه مشاوره',u.grade)+field('field','رشته مشاوره',u.field,'select',fields)+field('familiarity','عامل آشنایی',u.familiarity)+field('phone','شماره موبایل',u.phone)+field('app','اپلیکیشن ارتباطی',u.app)+field('username','نام کاربری',u.username)+field('password','رمز عبور',u.password)}
function field(n,l,v='',type='input',opts=[],readonly=false){if(type==='select'){let labels=arguments[5]||opts;return `<div class="field"><label>${l}</label><select id="f_${n}">${opts.map((o,i)=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(labels[i]??o)}</option>`).join('')}</select></div>`}return `<div class="field"><label>${l}</label><input id="f_${n}" value="${esc(v)}" ${readonly?'readonly':''}></div>`}
function saveMember(role,id){let d=currentDB(),o=id?d.users.find(x=>x.id===id):{id:uid('u'),role};let names=role==='student'?['first','last','grade','field','initialConsult','initialManager','joined','familiarity','exam','phone','app','username','password','consultantId']:['first','last','age','grade','field','familiarity','phone','app','username','password'];names.forEach(n=>{let el=document.getElementById('f_'+n);if(el)o[n]=el.value});if(!o.username||!o.password||!o.first||!o.last){toast('نام، نام خانوادگی، نام کاربری و رمز عبور الزامی است','bad');return}if(!id)d.users.push(o);save(d);closeModal();render();toast('حساب با موفقیت ذخیره شد')}
function viewUser(id){let d=currentDB(),u=d.users.find(x=>x.id===id),rs=d.reports.filter(r=>r.studentId===id);document.getElementById('modalBody').innerHTML=`<h2>${esc(u.first+' '+u.last)}</h2><p><span class="tag">${roleNames[u.role]}</span> <span class="tag">${esc(u.field||'')}</span> <span class="tag">${esc(u.grade||'')}</span></p><div class="grid g2"><div class="card"><b>نام کاربری</b><p>${esc(u.username)}</p><b>موبایل</b><p>${esc(u.phone||'—')}</p><b>اپ ارتباطی</b><p>${esc(u.app||'—')}</p></div><div class="card"><b>لقب</b><p>${esc(u.title||'—')}</p><b>گزارش‌ها</b><p>${rs.length}</p></div></div>`;document.getElementById('modal').classList.remove('hidden')}
function editTitle(id){let d=currentDB(),u=d.users.find(x=>x.id===id),v=prompt('لقب این عضو را وارد کنید:',u.title||'');if(v===null)return;u.title=v.trim();save(d);render()}
function removeUser(id){if(id==='u_manager'){toast('حساب مدیر ارشد اصلی قابل حذف نیست','bad');return}if(!confirm('این عضو حذف شود؟'))return;let d=currentDB();d.users=d.users.filter(x=>x.id!==id);save(d);render()}
function managerStats(){let d=currentDB(),students=d.users.filter(x=>x.role==='student'),cons=d.users.filter(x=>x.role==='consultant');return `<div class="pageTitle"><h2>آمار جامع آکادمی</h2><span class="tag">مدیریت کامل گزارش‌ها</span></div><div class="grid g4">${statCard('کل دانش‌آموزان',students.length)}${statCard('کل مشاوران',cons.length)}${statCard('کل گزارش‌ها',d.reports.length)}${statCard('گزارش‌های هفته',d.reports.filter(r=>daysAgo(r.date)<7).length)}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>دانش‌آموزان به تفکیک رشته و پایه</h3>${groupStats(students)}</div><div class="card"><h3>مشاوران به تفکیک رشته و پایه</h3>${groupStats(cons)}</div></div><div class="card" style="margin-top:16px"><h3>👥 پرونده دانش‌آموزان و سوابق گزارش</h3><p class="muted">روی نام هر دانش‌آموز بزنید تا تمام گزارش‌های ثبت‌شده او را با تاریخ ببینید.</p>${students.map(s=>{let rs=d.reports.filter(r=>r.studentId===s.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="studentStatRow"><div><b>${esc(s.first+' '+s.last)}</b><div><span class="tag">${esc(s.field||'بدون رشته')}</span> <span class="tag">${esc(s.grade||'بدون پایه')}</span> ${s.title?`<span class="tag">${esc(s.title)}</span>`:''}</div></div><div class="actions"><span class="tag">${rs.length} گزارش</span><button class="btn small" onclick="managerStudentReports('${s.id}')">مشاهده گزارش‌ها</button></div></div>`}).join('')||'<div class="empty">هنوز دانش‌آموزی ثبت نشده است.</div>'}</div><div class="card" style="margin-top:16px"><h3>ارسال گزارش</h3>${reportCounters(d)}</div>`}
function groupStats(arr){let m={};arr.forEach(x=>{let k=(x.field||'نامشخص')+' / '+(x.grade||'نامشخص');m[k]=(m[k]||0)+1});return Object.entries(m).map(([k,v])=>`<div class="metricline"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<div class="empty">داده‌ای نیست</div>'}
function reportCounters(d){let total=d.reports.length,week=d.reports.filter(r=>daysAgo(r.date)<7).length,month=d.reports.filter(r=>daysAgo(r.date)<30).length,year=d.reports.filter(r=>daysAgo(r.date)<365).length;let students=d.users.filter(x=>x.role==='student').length;return `<div class="grid g4"><div><b>امروز</b><div class="num">${d.reports.filter(r=>r.date===today()).length}</div><small>باقی‌مانده تقریبی: ${Math.max(0,students-d.reports.filter(r=>r.date===today()).length)}</small></div><div><b>هفته</b><div class="num">${week}</div></div><div><b>ماه</b><div class="num">${month}</div></div><div><b>سال</b><div class="num">${year}</div></div></div><p>کل ارسال ثبت‌شده: <b>${total}</b></p>`}
function daysAgo(ds){let a=new Date(ds.replaceAll('/','-')),b=new Date(today().replaceAll('/','-'));let n=Math.floor((b-a)/86400000);return isNaN(n)?999:n}
function managerSchedule(){let d=currentDB(),students=d.users.filter(x=>x.role==='student');return `<div class="pageTitle"><h2>برنامه‌های دانش‌آموزان</h2></div><div class="card"><div class="formgrid"><div class="field"><label>دانش‌آموز</label><select id="msStudent"><option value="">انتخاب کنید</option>${students.map(x=>`<option value="${x.id}">${esc(x.first+' '+x.last)}</option>`).join('')}</select></div><div class="field"><label>تاریخ برنامه</label><input id="msDate" type="date" value="${isoToday()}"></div></div><div class="actions"><button class="btn" onclick="showStudentPlans()">نمایش برنامه‌های ارسال‌شده</button></div><div id="msResult"></div></div>`}
function isoToday(){let d=new Date();return d.toISOString().slice(0,10)}
function showStudentPlans(){let d=currentDB(),sid=document.getElementById('msStudent').value,dt=document.getElementById('msDate').value;let arr=d.plans.filter(p=>p.studentId===sid&&p.date===dt);document.getElementById('msResult').innerHTML=arr.length?arr.map(p=>planCard(p)).join(''):'<div class="empty">برای این تاریخ برنامه‌ای ارسال نشده است.</div>'}
function planCard(p){let d=currentDB(),s=planStudent(p,d),m=planSentMeta(p);return `<div style="margin-top:12px">${weeklyShowcase(p,d)}</div>`}
function consultantReports(){let d=currentDB(),u=state.user,rs=d.reports.filter(r=>r.consultantId===u.id),dates=[...new Set(rs.map(r=>r.date))];let dt=state.selectedDate||today();let filtered=rs.filter(r=>r.date===dt);return `<div class="pageTitle"><h2>گزارشات دانش‌آموزان</h2></div><div class="card"><div class="formgrid"><div class="field"><label>تاریخ</label><input id="crDate" value="${esc(dt)}" onchange="state.selectedDate=this.value;render()"></div><div class="field"><label>پایه</label><select id="crGrade" onchange="setReportFilter('grade',this.value)"><option value="">همه پایه‌ها</option>${grades.map(g=>`<option ${getParam('grade')===g?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>رشته</label><select id="crField" onchange="setReportFilter('field',this.value)"><option value="">همه رشته‌ها</option>${fields.map(f=>`<option ${getParam('field')===f?'selected':''}>${f}</option>`).join('')}</select></div></div></div><div class="grid g3" style="margin-top:16px">${filtered.filter(r=>{let s=d.users.find(x=>x.id===r.studentId)||{};return(!getParam('grade')||s.grade===getParam('grade'))&&(!getParam('field')||s.field===getParam('field'))}).map(r=>reportSummary(r,d)).join('')||'<div class="card empty">برای این تاریخ گزارشی پیدا نشد.</div>'}</div>`}
function getParam(k){return new URLSearchParams(location.hash.split('?')[1]||'').get(k)||''}

function setReportFilter(k,v){let q=new URLSearchParams();let g=k==='grade'?v:getParam('grade'),f=k==='field'?v:getParam('field');if(g)q.set('grade',g);if(f)q.set('field',f);location.hash='panel?'+q.toString();render()}

function reviewReport(id,status){let d=currentDB(),r=d.reports.find(x=>x.id===id);if(!r||state.user.role!=='consultant'||r.consultantId!==state.user.id){toast('فقط مشاور مسئول گزارش می‌تواند آن را بررسی کند','bad');return}let note=document.getElementById('reviewNote')?.value.trim()||'';r.status=status;r.reviewNote=note|| (status==='approved'?'گزارش شما بررسی و تأیید شد.':'گزارش نیاز به اصلاح دارد.');r.reviewedAt=today();d.notifications.push({id:uid('n'),userId:r.consultantId,text:`گزارش ${r.date} بررسی شد: ${status==='approved'?'تأیید':'رد'}.`,read:false});d.notifications.push({id:uid('n'),userId:r.studentId,text:status==='approved'?`گزارش ${r.date} انجام شد و توسط مشاور تأیید شد.`:`گزارش ${r.date} انجام شد و توسط مشاور رد شد. دلیل: ${r.reviewNote}`,read:false});save(d);closeModal();render();toast('انجام شد؛ نتیجه برای دانش‌آموز ارسال شد')}
function reportAI(r,d,s){let tests=r.lessons.reduce((a,x)=>a+Number(x.tests||0),0),correct=r.lessons.reduce((a,x)=>a+Number(x.correct||0),0),wrong=r.lessons.reduce((a,x)=>a+Number(x.wrong||0),0),acc=tests?Math.round(correct/tests*100):0;let month=d.reports.filter(x=>x.studentId===r.studentId&&daysAgo(x.date)<30),avg=month.length?Math.round(month.reduce((a,x)=>a+scoreReport(x),0)/month.length):0;let strength=acc>=80?'دقت تستی مناسب و نقطه قوت اصلی امروز است.':'نیاز به افزایش دقت و تحلیل تست‌های غلط دارد.';let weakness=wrong>correct*.25?'تعداد غلط‌ها نسبت به صحیح بالاست؛ بررسی علت خطاها پیشنهاد می‌شود.':'الگوی غلط‌ها کنترل‌شده است.';return `<div class="grid g3"><div><small>دقت امروز</small><div class="rank">${acc}%</div></div><div><small>امتیاز ماه اخیر</small><div class="rank">${avg}/100</div></div><div><small>روند</small><div class="rank">${month.length>=3?'قابل تحلیل':'داده کم'}</div></div></div><p>🟢 قوت: ${strength}</p><p>🔴 ضعف: ${weakness}</p><p>🎯 پیشنهاد: فردا روی درس‌های کم‌دقت تمرکز شود و برای غلط‌ها زمان تحلیل جداگانه در نظر گرفته شود.</p>`}

function consultantDashboard(){let d=currentDB(),u=state.user,students=d.users.filter(x=>x.role==='student'&&x.consultantId===u.id),todayReports=d.reports.filter(r=>r.consultantId===u.id&&r.date===today()),sentIds=new Set(todayReports.map(r=>r.studentId)),sent=students.filter(s=>sentIds.has(s.id)),missing=students.filter(s=>!sentIds.has(s.id));return `<div class="pageTitle"><h2>داشبورد مشاور</h2><span class="tag">وضعیت گزارش امروز · ${esc(today())}</span></div><div class="grid g4">${statCard('دانش‌آموزان',students.length)}${statCard('گزارش امروز',sent.length)}${statCard('ارسال نکرده',missing.length)}${statCard('در انتظار بررسی',todayReports.filter(r=>r.status==='pending').length)}</div><div class="grid g2 consultantReportLists"><div class="dailyReportList sent"><div class="kpi"><h3>🟢 دانش‌آموزانی که گزارش فرستاده‌اند</h3><span class="tag good">${sent.length} نفر</span></div>${sent.map(s=>{let r=todayReports.find(x=>x.studentId===s.id);return `<div class="dailyStudent"><div><b>${esc(s.first+' '+s.last)}</b><small>${esc(s.grade||'بدون پایه')} · ${esc(s.field||'بدون رشته')} · ارسال‌شده</small></div><button class="btn small" onclick="openReport('${r.id}')">مشاهده گزارش</button></div>`}).join('')||'<div class="empty">امروز هنوز گزارشی ارسال نشده است.</div>'}</div><div class="dailyReportList missing"><div class="kpi"><h3>🔴 دانش‌آموزانی که گزارش نفرستاده‌اند</h3><span class="tag bad">${missing.length} نفر</span></div>${missing.map(s=>`<div class="dailyStudent"><div><b>${esc(s.first+' '+s.last)}</b><small>${esc(s.grade||'بدون پایه')} · ${esc(s.field||'بدون رشته')} · هنوز گزارشی ثبت نشده</small></div><span class="tag bad">پیگیری شود</span></div>`).join('')||'<div class="empty">همه دانش‌آموزان امروز گزارش خود را فرستاده‌اند. 🎉</div>'}</div></div>`}
function studentDashboard(){let d=currentDB(),u=state.user,rs=d.reports.filter(r=>r.studentId===u.id).sort((a,b)=>b.date.localeCompare(a.date));let last=rs[0];return `<div class="pageTitle"><h2>سلام ${esc(u.first)} 👋</h2><span class="tag">${esc(u.title||roleNames[u.role])}</span></div><div class="grid g4">${statCard('گزارش‌های ثبت‌شده',rs.length)}${statCard('تأییدشده',rs.filter(x=>x.status==='approved').length)}${statCard('ردشده',rs.filter(x=>x.status==='rejected').length)}${statCard('اعلان‌ها',d.notifications.filter(x=>x.userId===u.id&&!x.read).length)}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>آخرین گزارش</h3>${last?`<p>${esc(last.date)} — <span class="tag ${last.status==='approved'?'good':last.status==='rejected'?'bad':'warn'}">${statusText(last.status)}</span></p><button class="btn" onclick="openReport('${last.id}')">مشاهده</button>`:'<div class="empty">هنوز گزارشی ثبت نشده است.</div>'}</div><div class="card"><h3>اعلان‌ها</h3>${d.notifications.filter(x=>x.userId===u.id).slice(-5).reverse().map(x=>`<div class="notice">${esc(x.text)}</div>`).join('')||'<div class="empty">اعلانی نیست.</div>'}</div></div>`}

let lessonCount=0;function addLesson(data={}){lessonCount++;let i=lessonCount;let box=document.createElement('div');box.className='card lessonCard';box.id='lesson_'+i;box.innerHTML=`<div class="kpi"><h3>درس ${i}</h3><button class="btn small danger" onclick="document.getElementById('lesson_${i}').remove()">حذف</button></div><div class="formgrid"><div class="field"><label>نام درس</label><input class="ls-sub" value="${esc(data.subject||'')}"></div><div class="field"><label>مبحث خوانده شده</label><input class="ls-topic" value="${esc(data.topic||'')}"></div><div class="field"><label>کتاب</label><input class="ls-book" value="${esc(data.book||'')}"></div><div class="field"><label>پایه</label><select class="ls-grade">${grades.map(g=>`<option ${g===data.grade?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label>تعداد تست برنامه</label><input class="ls-plan" type="number" min="0" value="${data.plannedTests||0}"></div><div class="field"><label>تعداد تست زده‌شده</label><input class="ls-tests" type="number" min="0" value="${data.tests||0}"></div><div class="field"><label>صحیح</label><input class="ls-correct" type="number" min="0" value="${data.correct||0}"></div><div class="field"><label>غلط</label><input class="ls-wrong" type="number" min="0" value="${data.wrong||0}"></div><div class="field"><label>خالی</label><input class="ls-blank" type="number" min="0" value="${data.blank||0}"></div><div class="field"><label>تعداد سوال نهایی باید حل می‌شد</label><input class="ls-fp" type="number" min="0" value="${data.finalPlanned||0}"></div><div class="field"><label>تعداد نهایی حل‌شده</label><input class="ls-fs" type="number" min="0" value="${data.finalSolved||0}"></div><div class="field"><label>نهایی درست</label><input class="ls-fc" type="number" min="0" value="${data.finalCorrect||0}"></div><div class="field"><label>نهایی غلط</label><input class="ls-fw" type="number" min="0" value="${data.finalWrong||0}"></div><div class="field"><label>نهایی خالی</label><input function submitReport(){let d=currentDB(),u=state.user,existing=d.reports.find(x=>x.studentId===u.id&&x.date===today());if(existing&&existing.status!=='rejected'){toast('برای امشب گزارش ثبت شده و امکان ارسال مجدد ندارد','bad');return}let boxes=[...document.querySelectorAll('.lessonCard[id^="lesson_"]')];if(!boxes.length){toast('حداقل یک درس اضافه کنید','bad');return}let lessons=boxes.map(b=>({subject:b.querySelector('.ls-sub').value,topic:b.querySelector('.ls-topic').value,book:b.querySelector('.ls-book').value,grade:b.querySelector('.ls-grade').value,plannedTests:+b.querySelector('.ls-plan').value,tests:+b.querySelector('.ls-tests').value,correct:+b.querySelector('.ls-correct').value,wrong:+b.querySelector('.ls-wrong').value,blank:+b.querySelector('.ls-blank').value,finalPlanned:+b.querySelector('.ls-fp').value,finalSolved:+b.querySelector('.ls-fs').value,finalCorrect:+b.querySelector('.ls-fc').value,finalWrong:+b.querySelector('.ls-fw').value,finalBlank:+b.querySelector('.ls-fb').value}));let r=existing||{id:uid('rep')};Object.assign(r,{studentId:u.id,consultantId:u.consultantId,date:today(),status:'pending',reviewNote:'',reviewedAt:'',lessons,satisfaction:document.getElementById('satisfaction').value,todayProgress:document.getElementById('todayProgress').value,weekProgress:document.getElementById('weekProgress').value});if(existing){let idx=d.reports.findIndex(x=>x.id===existing.id);d.reports[idx]=r}else d.reports.push(r);d.notifications.push({id:uid('n'),userId:u.consultantId,text:`گزارش شبانه جدید ${u.first+' '+u.last} برای بررسی ارسال شد.`,read:false});save(d);state.section='dashboard';render();toast('گزارش با موفقیت ارسال شد')}
function chatView(){let d=currentDB(),u=state.user;let comms=d.communities.filter(c=>c.members.includes(u.id)||c.admins.includes(u.id)||u.role==='manager');let contacts=d.users.filter(x=>x.id!==u.id&&(u.role==='manager'||x.role!==u.role));let chats=[...comms.map(c=>({id:c.id,type:'comm',name:c.name,sub:c.type==='channel'?'کانال':'گروه'})),...contacts.map(x=>({id:'p_'+x.id,type:'private',name:x.first+' '+x.last,sub:roleNames[x.role]}))];let selected=state.selectedChat||chats[0]?.id;if(selected)markChatRead(selected);return `<div class="pageTitle"><h2>فریاد چت</h2>${u.role==='manager'?`<div class="actions"><button class="btn" onclick="createCommunity('group')">+ گروه</button><button class="btn secondary" onclick="createCommunity('channel')">+ کانال</button></div>`:''}</div><div class="card" style="margin-bottom:16px"><h3>🔎 عضویت با کد گروه یا کانال</h3><p class="muted">کد کوتاه را وارد کنید؛ مثال: GP2 یا CH5</p><div class="formgrid"><div class="field"><label>کد عضویت</label><input id="joinCode" placeholder="GP2 یا CH5" onkeydown="if(event.key==='Enter')joinByCode()"></div><div class="actions" style="align-items:end"><button class="btn" onclick="joinByCode()">عضویت</button></div></div></div><div class="chat"><div class="chatlist">${chats.map(c=>{let un=chatUnread(c.id,u.id);return `<div class="chatitem ${selected===c.id?'active':''} ${un?'hasUnread':''}" onclick="state.selectedChat='${c.id}';markChatRead('${c.id}');render()"><b>${esc(c.name)}</b>${un?'<span class="unreadDot"></span>':''}<small style="display:block;color:#64748b">${esc(c.sub)}</small></div>`}).join('')||'<div class="empty">مکالمه‌ای نیست</div>'}</div><div class="chatbody">${renderChatBody(selected,d,u)}</div></div>`}
function renderChatBody(id,d,u){if(!id)return '<div class="empty">یک گفتگو انتخاب کنید.</div>';if(id.startsWith('p_')){let other=d.users.find(x=>x.id===id.slice(2));let msgs=d.messages.filter(m=>m.type==='private'&&((m.from===u.id&&m.to===other.id)||(m.from===other.id&&m.to===u.id)));return `<div class="messages">${msgs.map(m=>bubble(m,u,d)).join('')||'<div class="empty">شروع گفتگو</div>'}</div><div class="chatinput"><input id="chatText" placeholder="پیام شما..." onkeydown="if(event.key==='Enter')sendPrivate('${other.id}')"><button class="btn" onclick="sendPrivate('${other.id}')">ارسال</button></div>`}let c=d.communities.find(x=>x.id===id);let msgs=c.messages||[];let canSend=c.type==='group'||c.admins.includes(u.id)||u.role==='manager';return `<div class="messages">${msgs.map(m=>bubble(m,u,d)).join('')||'<div class="empty">هنوز پیامی نیست</div>'}</div>${canSend?`<div class="chatinput"><input id="chatText" placeholder="پیام شما..." onkeydown="if(event.key==='Enter')sendCommunity('${c.id}')"><button class="btn" onclick="sendCommunity('${c.id}')">ارسال</button></div>`:'<div class="notice">این کانال فقط برای ارسال پیام توسط ادمین‌هاست.</div>'}<div class="actions" style="padding:10px"><span class="tag">کد عضویت: ${esc(c.code)}</span>${u.role==='manager'?`<button class="btn secondary small" onclick="manageCommunity('${c.id}')">مدیریت اعضا و ادمین‌ها</button><button class="btn secondary small" style="color:#b91c1c;border-color:#fecaca" onclick="deleteCommunity('${c.id}')">حذف ${c.type==='group'?'گروه':'کانال'}</button>`:''}</div>`}
function bubble(m,u,d){let from=d.users.find(x=>x.id===m.from)||{};return `<div class="bubble ${m.from===u.id?'me':''}"><b>${esc(from.first+' '+from.last)} <small style="display:inline">${roleNames[from.role]||''} ${from.title?'· '+esc(from.title):''}</small></b><div>${esc(m.text)}</div><small>${esc(m.time||'')}</small></div>`}
function sendPrivate(other){let t=document.getElementById('chatText').value.trim();if(!t)return;let d=currentDB();d.messages.push({id:uid('m'),type:'private',from:state.user.id,to:other,text:t,time:new Date().toLocaleTimeString('fa-IR'),readBy:[state.user.id]});save(d);render()}
function sendCommunity(id){let t=document.getElementById('chatText').value.trim();if(!t)return;let d=currentDB(),c=d.communities.find(x=>x.id===id);if(c.type==='channel'&&!c.admins.includes(state.user.id)&&state.user.role!=='manager'){toast('فقط ادمین‌ها می‌توانند در کانال پیام دهند','bad');return}c.messages.push({id:uid('m'),from:state.user.id,text:t,time:new Date().toLocaleTimeString('fa-IR'),readBy:[state.user.id]});save(d);render()}
function createCommunity(type){let name=prompt('نام '+(type==='group'?'گروه':'کانال')+' را وارد کنید');if(!name)return;let d=currentDB(),key=type==='group'?'seqGroup':'seqChannel',start=type==='group'?2:5,max=1000,n=Math.max(start,Number(d.settings[key])||start);if(n>max){toast('ظرفیت کدهای این بخش تا '+(type==='group'?'GP1000':'CH1000')+' تکمیل شده است','bad');return}let code=(type==='group'?'GP':'CH')+n;d.settings[key]=n+1;d.communities.push({id:uid('c'),type,code,name,description:'',ownerId:state.user.id,admins:[state.user.id],members:[state.user.id],messages:[]});save(d);render();toast('ایجاد شد: '+code)}
function deleteCommunity(id){let d=currentDB(),c=d.communities.find(x=>x.id===id);if(!c||state.user.role!=='manager')return;if(!confirm(`آیا از حذف ${c.type==='group'?'گروه':'کانال'} «${c.name}» با کد ${c.code} مطمئن هستید؟`))return;d.communities=d.communities.filter(x=>x.id!==id);save(d);state.selectedChat=null;render();toast('حذف شد')}
function copyJoin(code){let url=location.href.split('#')[0]+'#join='+code;navigator.clipboard?.writeText(url);toast('لینک دعوت کپی شد')}
function manageCommunity(id){let d=currentDB(),c=d.communities.find(x=>x.id===id),members=d.users.filter(u=>c.members.includes(u.id));document.getElementById('modalBody').innerHTML=`<h2>مدیریت ${esc(c.name)} — ${c.code}</h2>${members.map(u=>`<div class="metricline"><span>${esc(u.first+' '+u.last)} · ${roleNames[u.role]}</span><span>${c.admins.includes(u.id)?'<span class="tag">ادمین</span>':''} <button class="btn small secondary" onclick="toggleAdmin('${c.id}','${u.id}')">ادمین</button></span></div>`).join('')}<div class="field"><label>افزودن عضو</label><select id="addMember">${d.users.filter(u=>!c.members.includes(u.id)).map(u=>`<option value="${u.id}">${esc(u.first+' '+u.last)}</option>`).join('')}</select></div><button class="btn" onclick="addCommunityMember('${c.id}')">افزودن</button>`;document.getElementById('modal').classList.remove('hidden')}
function toggleAdmin(cid,uid){let d=currentDB(),c=d.communities.find(x=>x.id===cid);if(c.admins.includes(uid))c.admins=c.admins.filter(x=>x!==uid);else c.admins.push(uid);save(d);manageCommunity(cid)}
function addCommunityMember(cid){let d=currentDB(),c=d.communities.find(x=>x.id===cid),id=document.getElementById('addMember').value;if(id&&!c.members.includes(id))c.members.push(id);save(d);manageCommunity(cid)}
function unreadChatCount(){let d=currentDB(),u=state.user;if(!u)return 0;let ids=[];d.messages.filter(m=>m.type==='private'&&(m.to===u.id||m.from===u.id)).forEach(m=>{if(m.to===u.id&&!m.readBy?.includes(u.id))ids.push('p_'+m.from)});d.communities.filter(c=>c.members.includes(u.id)||c.admins.includes(u.id)||u.role==='manager').forEach(c=>{if((c.messages||[]).some(m=>m.from!==u.id&&!m.readBy?.includes(u.id)))ids.push(c.id)});return new Set(ids).size}
function chatUnread(id,uid){let d=currentDB();if(id.startsWith('p_')){let other=id.slice(2);return d.messages.some(m=>m.type==='private'&&m.from===other&&m.to===uid&&!m.readBy?.includes(uid))}let c=d.communities.find(x=>x.id===id);return !!c&&(c.messages||[]).some(m=>m.from!==uid&&!m.readBy?.includes(uid))}
function markChatRead(id){if(!id||!state.user)return;let d=currentDB(),uid=state.user.id;if(id.startsWith('p_'))d.messages.forEach(m=>{if(m.type==='private'&&m.to===uid&&m.from===id.slice(2)){m.readBy=m.readBy||[];if(!m.readBy.includes(uid))m.readBy.push(uid)}});else{let c=d.communities.find(x=>x.id===id);if(c)(c.messages||[]).forEach(m=>{if(m.from!==uid){m.readBy=m.readBy||[];if(!m.readBy.includes(uid))m.readBy.push(uid)}})}save(d)}
function unreadAnnouncementCount(){let d=currentDB(),u=state.user;return d.notifications.filter(n=>n.userId===u.id&&!n.readBy?.includes(u.id)).length}
function unreadPlanCount(){let d=currentDB(),u=state.user;return d.plans.filter(p=>p.studentId===u.id&&!p.readBy?.includes(u.id)).length}
function markAllNotificationsRead(){let d=currentDB(),u=state.user;if(!u)return;d.notifications.filter(n=>n.userId===u.id).forEach(n=>{n.readBy=n.readBy||[];if(!n.readBy.includes(u.id))n.readBy.push(u.id);n.read=true});save(d)}
function announcementsView(){let d=currentDB(),u=state.user,arr=d.notifications.filter(n=>n.userId===u.id).sort((a,b)=>(b.time||'').localeCompare(a.time||''));return `<div class="pageTitle"><h2>اعلان‌ها و پیام‌ها</h2>${arr.some(n=>!n.readBy?.includes(u.id))?'<span class="tag good">پیام جدید</span>':''}</div><div class="card"><p class="muted">اعلان‌ها، اطلاعیه‌ها و پیام‌های سیستمی شما در اینجا ثبت می‌شوند.</p>${arr.map(n=>`<div class="notice ${n.readBy?.includes(u.id)?'':'unreadNotice'}"><b>${esc(n.title||notificationTitle(n))}</b><div style="margin-top:6px">${esc(n.text||'')}</div><small>${esc(n.time||'')}</small></div>`).join('')||'<div class="empty">پیام جدیدی ندارید.</div>'}</div>`}
function notificationTitle(n){return n.type==='plan'?'برنامه هفتگی جدید':n.type==='exam'?'اطلاعات آزمون':'پیام جدید'}
function markAnnouncementRead(id){let d=currentDB(),n=d.notifications.find(x=>x.id===id);if(n){n.readBy=n.readBy||[];if(!n.readBy.includes(state.user.id))n.readBy.push(state.user.id);n.read=true;save(d);render()}}
function consultantAnnouncements(){let d=currentDB(),u=state.user,students=d.users.filter(x=>x.role==='student'&&x.consultantId===u.id);return `<div class="pageTitle"><h2>اعلان‌ها</h2></div><div class="card"><h3>ارسال اعلان برای دانش‌آموزان</h3><div class="formgrid"><div class="field"><label>مخاطب</label><select id="annTarget"><option value="all">همه دانش‌آموزان من</option>${students.map(s=>`<option value="${s.id}">${esc(s.first+' '+s.last)}</option>`).join('')}</select></div><div class="field"><label>عنوان</label><input id="annTitle" placeholder="مثلاً اطلاعیه آزمون"></div></div><div class="field" style="margin-top:12px"><label>متن اعلان</label><textarea id="annText" placeholder="متن اطلاعیه را بنویسید..."></textarea></div><div class="actions"><button class="btn" onclick="sendAnnouncement()">ارسال اعلان</button></div></div>`}
function sendAnnouncement(){let d=currentDB(),u=state.user,title=document.getElementById('annTitle').value.trim(),text=document.getElementById('annText').value.trim(),target=document.getElementById('annTarget').value;if(!title||!text){toast('عنوان و متن اعلان را وارد کنید','bad');return}let ids=target==='all'?d.users.filter(x=>x.role==='student'&&x.consultantId===u.id).map(x=>x.id):[target];ids.forEach(id=>d.notifications.push({id:uid('n'),userId:id,type:'announcement',senderId:u.id,title,text,time:new Date().toLocaleString('fa-IR'),read:false,readBy:[]}));save(d);render();toast('اعلان ارسال شد')}
function examsView(){let d=currentDB(),u=state.user,c=u.examCredentials||{username:'',password:'',updatedAt:''};return `<div class="pageTitle"><h2>آزمون‌ها</h2></div><div class="grid g2"><div class="card examHero"><div class="examIcon">🎯</div><h3>ورود به آزمون‌ها</h3><p class="muted">برای ورود به سامانه آزمون روی دکمه زیر بزنید.</p><a class="btn" href="https://www.quiz24.ir/student/exams" target="_blank" rel="noopener noreferrer">ورود به آزمون‌ها</a></div><div class="card credentialBox"><h3>دریافت یوزرنیم و پسورد آزمون</h3>${c.username&&c.password?`<div class="notice success"><b>نام کاربری:</b> ${esc(c.username)}<br><b>رمز عبور:</b> ${esc(c.password)}</div><p class="muted">این اطلاعات تا زمانی که مشاور تغییرشان دهد برای شما باقی می‌ماند.</p>${c.updatedAt?`<small>آخرین بروزرسانی: ${esc(c.updatedAt)}</small>`:''}`:'<div class="empty">هنوز اطلاعات آزمون برای شما ثبت نشده است.</div>'}</div></div>`}
function consultantExams(){let d=currentDB(),u=state.user,students=d.users.filter(x=>x.role==='student'&&x.consultantId===u.id),sel=state.examStudentId||students[0]?.id||'';return `<div class="pageTitle"><h2>آزمون‌ها</h2></div><div class="grid g2"><div class="card"><h3>ارسال اطلاعات آزمون</h3><div class="field"><label>دانش‌آموز</label><select id="examStudent" onchange="state.examStudentId=this.value;loadExamCredentials()">${students.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.first+' '+s.last)}</option>`).join('')}</select></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>یوزرنیم</label><input id="examUsername" value="${esc((students.find(x=>x.id===sel)?.examCredentials?.username)||'')}"></div><div class="field"><label>پسورد</label><input id="examPassword" type="text" value="${esc((students.find(x=>x.id===sel)?.examCredentials?.password)||'')}"></div></div><div class="actions"><button class="btn" onclick="saveExamCredentials()">ارسال / بروزرسانی اطلاعات</button></div></div><div class="card"><h3>وضعیت اطلاعات دانش‌آموزان</h3>${students.map(s=>`<div class="examStudentRow"><span>${esc(s.first+' '+s.last)}</span><span class="tag ${s.examCredentials?.username?'good':'warn'}">${s.examCredentials?.username?'ثبت شده':'ثبت نشده'}</span></div>`).join('')||'<div class="empty">دانش‌آموزی به شما اختصاص داده نشده است.</div>'}</div></div>`}
function loadExamCredentials(){let id=document.getElementById('examStudent')?.value||state.examStudentId;if(!id)return;state.examStudentId=id;let d=currentDB(),s=d.users.find(x=>x.id===id);if(!s)return;document.getElementById('examUsername').value=s.examCredentials?.username||'';document.getElementById('examPassword').value=s.examCredentials?.password||''}
function saveExamCredentials(){let d=currentDB(),u=state.user,id=document.getElementById('examStudent')?.value||state.examStudentId,s=d.users.find(x=>x.id===id);if(!s||s.role!=='student'||s.consultantId!==u.id){toast('این دانش‌آموز زیر نظر شما نیست','bad');return}let user=document.getElementById('examUsername').value.trim(),pass=document.getElementById('examPassword').value.trim();if(!user||!pass){toast('یوزرنیم و پسورد را وارد کنید','bad');return}s.examCredentials={username:user,password:pass,updatedAt:new Date().toLocaleString('fa-IR'),updatedBy:u.id};d.notifications.push({id:uid('n'),userId:s.id,type:'exam',title:'اطلاعات آزمون بروزرسانی شد',text:'یوزرنیم و پسورد آزمون شما توسط مشاور ثبت یا بروزرسانی شد.',time:new Date().toLocaleString('fa-IR'),read:false,readBy:[]});save(d);render();toast('اطلاعات آزمون ذخیره و بروزرسانی شد')}
function managerAI(){let d=currentDB(),students=d.users.filter(x=>x.role==='student'),cons=d.users.filter(x=>x.role==='consultant');return `<div class="pageTitle"><h2>فریاد AI — تحلیل مدیریتی</h2></div><div class="grid g2"><div class="card"><h3>تحلیل دانش‌آموزان</h3>${students.map(s=>{let rs=d.reports.filter(r=>r.studentId===s.id),avg=rs.length?Math.round(rs.reduce((a,r)=>a+scoreReport(r),0)/rs.length):0;return `<div class="metricline"><span>${esc(s.first+' '+s.last)}</span><span>${avg}% · ${rs.length} گزارش</span></div>`}).join('')}</div><div class="card"><h3>تحلیل عملکرد مشاوران</h3>${cons.map(c=>{let rs=d.reports.filter(r=>r.consultantId===c.id),ap=rs.filter(r=>r.status==='approved').length;return `<div class="metricline"><span>${esc(c.first+' '+c.last)}</span><span>${rs.length} گزارش · ${rs.length?Math.round(ap/rs.length*100):0}% تأیید</span></div>`}).join('')}</div></div><div class="card" style="margin-top:16px"><h3>نمودار کلی گزارش‌ها</h3>${['تأییدشده','در انتظار','ردشده'].map((x,i)=>{let k=['approved','pending','rejected'][i],n=d.reports.filter(r=>r.status===k).length,p=d.reports.length?Math.round(n/d.reports.length*100):0;return `<div class="metricline"><span>${x}</span><b>${n}</b></div><div class="progress"><i style="width:${p}%"></i></div>`}).join('')}</div>`}
function studentAI(){let d=currentDB(),rs=d.reports.filter(r=>r.studentId===state.user.id);return `<div class="pageTitle"><h2>فریاد AI آموزشی</h2></div><div class="card"><h3>دستیار آموزشی فریاد</h3><p>سؤال درسی خود را بنویسید. این نسخه یک دستیار محلی و قاعده‌محور است.</p><div class="field"><textarea id="aiQ" placeholder="مثلاً چطور زیست را بهتر مرور کنم؟"></textarea></div><button class="btn" onclick="askAI()">پرسش از فریاد AI</button><div id="aiAns"></div></div>`}
function askAI(){let q=document.getElementById('aiQ').value.trim();if(!q)return;document.getElementById('aiAns').innerHTML=`<div class="notice" style="margin-top:12px"><b>پاسخ فریاد AI:</b><br>برای «${esc(q)}» ابتدا هدف را مشخص کن، مبحث را به بخش‌های کوچک تقسیم کن، سپس مطالعه فعال و تست زمان‌دار انجام بده و غلط‌ها را تحلیل کن. اگر سؤال تخصصی درسی داری، متن کامل سؤال و گزینه‌ها را هم بنویس.</div>`}
function percent(){return `<div class="pageTitle"><h2>درصدگیری</h2></div><div class="card"><div class="formgrid"><div class="field"><label>تعداد کل تست</label><input id="pt" type="number" min="0"></div><div class="field"><label>صحیح</label><input id="pc" type="number" min="0"></div><div class="field"><label>غلط</label><input id="pw" type="number" min="0"></div><div class="field"><label>نزده</label><input id="pb" type="number" min="0"></div></div><div class="actions"><button class="btn" onclick="calcPercent()">محاسبه درصد</button></div><div id="pout"></div></div>`}
function calcPercent(){let t=+document.getElementById('pt').value,c=+document.getElementById('pc').value,w=+document.getElementById('pw').value,b=+document.getElementById('pb').value;if(t<=0){document.getElementById('pout').innerHTML='<div class="notice dangerbox">تعداد کل تست را وارد کنید.</div>';return}let pct=((c*3-w)/(t*3))*100;document.getElementById('pout').innerHTML=`<div class="card" style="margin-top:12px"><h2>${pct.toFixed(2)}٪</h2><p>صحیح: ${c} | غلط: ${w} | نزده: ${b}</p></div>`}
function joinByCode(){let input=document.getElementById('joinCode');let code=(input?.value||'').trim().toUpperCase().replace(/\s+/g,'');if(!/^GP(?:[2-9]|[1-9]\d{1,2}|1000)$/.test(code)&&!/^CH(?:[5-9]|[1-9]\d{1,2}|1000)$/.test(code)){toast('کد معتبر نیست؛ مثال GP2 یا CH5','bad');return}let d=currentDB(),c=d.communities.find(x=>x.code===code);if(!c){toast('گروه یا کانالی با این کد پیدا نشد','bad');return}if(c.members.includes(state.user.id)){state.selectedChat=c.id;render();toast('شما قبلاً عضو این بخش هستید');return}c.members.push(state.user.id);save(d);state.selectedChat=c.id;render();toast('عضویت با موفقیت انجام شد: '+code)}
function handleJoin(){let m=location.hash.match(/join=([^&]+)/);if(!m)return;let d=currentDB(),c=d.communities.find(x=>x.code===m[1]);if(!c)return; if(!state.user){toast('ابتدا وارد حساب شوید تا عضویت انجام شود','bad');return}if(!c.members.includes(state.user.id))c.members.push(state.user.id);save(d);state.section='chat';state.selectedChat=c.id;history.replaceState(null,'',location.pathname);render();toast('با موفقیت عضو شدید')}
window.addEventListener('hashchange',handleJoin);window.addEventListener('load',()=>{handleJoin();render()});
</script>
</body></html>
